name: CI/CD (prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cicd-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_API:    booquest-ai           # prod용 이미지명(레지스트리 path는 secrets)
  IMAGE_WORKER: booquest-ai-worker
  API_CTN:      booquest-ai
  WORKER_CTN:   booquest-ai-worker
  APP_PORT: "8081"                    # 컨테이너 내부 포트 (호스트 포트 매핑은 안 씀)
  DEPLOY_TAG: latest
  DOCKERFILE_API: docker/api.Dockerfile
  DOCKERFILE_WORKER: docker/worker.Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to NCP registry (prod)
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD_PROD }}" | docker login "${{ secrets.REGISTRY_URL_PROD }}" \
            -u "${{ secrets.REGISTRY_USERNAME_PROD }}" --password-stdin

      - name: Build API image
        run: |
          docker build -f "${{ env.DOCKERFILE_API }}" \
            -t "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_API }}:${{ env.DEPLOY_TAG }}" \
            -t "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_API }}:${GITHUB_SHA::7}" \
            .

      - name: Build Worker image
        run: |
          docker build -f "${{ env.DOCKERFILE_WORKER }}" \
            -t "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_WORKER }}:${{ env.DEPLOY_TAG }}" \
            -t "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_WORKER }}:${GITHUB_SHA::7}" \
            .

      - name: Push images
        run: |
          docker push "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_API }}:${{ env.DEPLOY_TAG }}"
          docker push "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_API }}:${GITHUB_SHA::7}"
          docker push "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_WORKER }}:${{ env.DEPLOY_TAG }}"
          docker push "${{ secrets.REGISTRY_URL_PROD }}/${{ env.IMAGE_WORKER }}:${GITHUB_SHA::7}"

      - name: Logout
        if: always()
        run: docker logout "${{ secrets.REGISTRY_URL_PROD }}" || true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on PROD API VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD_API }}
          username: ${{ secrets.SSH_USER_PROD_API }}
          key: ${{ secrets.SSH_KEY_PROD_API }}
          command_timeout: 20m
          script: |
            set -euo pipefail

            REG="${{ secrets.REGISTRY_URL_PROD }}"
            IMG_API="$REG/${{ env.IMAGE_API }}:${{ env.DEPLOY_TAG }}"
            IMG_WORKER="$REG/${{ env.IMAGE_WORKER }}:${{ env.DEPLOY_TAG }}"
            API_CTN="${{ env.API_CTN }}"
            WORKER_CTN="${{ env.WORKER_CTN }}"
            CONFIG_PATH="/opt/booquest-ai/config"

            # 1) 레지스트리 로그인
            echo "${{ secrets.REGISTRY_PASSWORD_PROD }}" | docker login "$REG" \
              -u "${{ secrets.REGISTRY_USERNAME_PROD }}" --password-stdin

            # 2) 네트워크 확보
            docker network create booquest-net 2>/dev/null || true

            # 3) Valkey 없으면 생성(있으면 스킵). 운영은 포트 개방 불필요(내부통신만).
            if ! docker ps -a --format '{{.Names}}' | grep -q '^valkey$'; then
              docker run -d \
                --name valkey \
                --restart unless-stopped \
                --network booquest-net \
                --network-alias valkey \
                -v valkey_data:/data \
                valkey/valkey:latest
            fi

            # 4) 이미지 pull
            docker pull "$IMG_API"
            docker pull "$IMG_WORKER"

            # 5) 이전 컨테이너 정리
            docker rm -f "$API_CTN" "$WORKER_CTN" 2>/dev/null || true

            # 6) AI API 컨테이너 (호스트 포트 매핑 없음: Nginx 내부 프록시만 사용)
            docker run -d \
              --name "$API_CTN" \
              --restart unless-stopped \
              --network booquest-net \
              --network-alias booquest-ai \
              -v "$CONFIG_PATH":/app/config:ro \
              -e PYTHONPATH=/app \
              "$IMG_API"

            # 7) Worker 컨테이너
            docker run -d \
              --name "$WORKER_CTN" \
              --restart unless-stopped \
              --network booquest-net \
              --network-alias booquest-ai-worker \
              -v "$CONFIG_PATH":/app/config:ro \
              -e PYTHONPATH=/app \
              "$IMG_WORKER"

            # 8) 이미지 정리
            docker image prune -f || true